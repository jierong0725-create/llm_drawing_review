{% extends "spa.html" %}
{% block scripts %}
<script type="text/babel" src="/static/jsx/marker_label.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── URL helpers ──────────────────────────────────────────────────────────
const pathParts = window.location.pathname.split("/");
const partId = Number(pathParts[2]);
const versionId = Number(pathParts[4]);

// ── usePanZoom hook ──────────────────────────────────────────────────────
function usePanZoom(containerRef) {
  const [zoom, setZoom] = useState(0.85);
  const [offsetX, setOffsetX] = useState(0);
  const [offsetY, setOffsetY] = useState(0);
  const isPanning = useRef(false);
  const lastMouse = useRef({ x: 0, y: 0 });

  const fitScreen = useCallback(() => {
    const container = containerRef.current;
    if (!container) return;
    const img = container.querySelector("img");
    if (!img || !img.complete || !img.naturalWidth) {
      setZoom(1); setOffsetX(0); setOffsetY(0);
      return;
    }
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    const scale = Math.min(cw / img.naturalWidth, ch / img.naturalHeight, 1.5);
    setZoom(scale);
    setOffsetX((cw - img.naturalWidth * scale) / 2);
    setOffsetY((ch - img.naturalHeight * scale) / 2);
  }, [containerRef]);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    setZoom((z) => {
      const newZoom = Math.min(8, Math.max(0.1, z * delta));
      const rect = containerRef.current.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      setOffsetX((ox) => mx - (mx - ox) * (newZoom / z));
      setOffsetY((oy) => my - (my - oy) * (newZoom / z));
      return newZoom;
    });
  }, [containerRef]);

  const handleMouseDown = useCallback((e) => {
    if (e.target.tagName === "IMG" || e.target === containerRef.current) {
      isPanning.current = true;
      lastMouse.current = { x: e.clientX, y: e.clientY };
    }
  }, [containerRef]);

  const handleMouseMove = useCallback((e) => {
    if (!isPanning.current) return;
    const dx = e.clientX - lastMouse.current.x;
    const dy = e.clientY - lastMouse.current.y;
    lastMouse.current = { x: e.clientX, y: e.clientY };
    setOffsetX((ox) => ox + dx);
    setOffsetY((oy) => oy + dy);
  }, []);

  const handleMouseUp = useCallback(() => {
    isPanning.current = false;
  }, []);

  const handleDblClick = useCallback(() => {
    fitScreen();
  }, [fitScreen]);

  return { zoom, offsetX, offsetY, setOffsetX, setOffsetY, fitScreen, handleWheel, handleMouseDown, handleMouseMove, handleMouseUp, handleDblClick };
}

// ── Repulsion algorithm ──────────────────────────────────────────────────
function applyRepulsion(dims, zoom, minGapPx) {
  const gap = minGapPx || 28;
  const adjusted = dims.map((d, i) => ({ ...d, _gx: 0, _gy: 0, _idx: i }));
  const threshold = gap / Math.max(zoom, 0.1);

  for (let iter = 0; iter < 10; iter++) {
    let moved = false;
    for (let i = 0; i < adjusted.length; i++) {
      for (let j = i + 1; j < adjusted.length; j++) {
        const dx = (adjusted[i].anchor_x + adjusted[i]._gx) - (adjusted[j].anchor_x + adjusted[j]._gx);
        const dy = (adjusted[i].anchor_y + adjusted[i]._gy) - (adjusted[j].anchor_y + adjusted[j]._gy);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < threshold && dist > 0.01) {
          const push = (threshold - dist) / dist * 0.5;
          const px = dx * push;
          const py = dy * push;
          adjusted[i]._gx += px;
          adjusted[i]._gy += py;
          adjusted[j]._gx -= px;
          adjusted[j]._gy -= py;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  return adjusted;
}

// ── DrawingCanvas component ──────────────────────────────────────────────
function DrawingCanvas({ drawing, dims, selectedDimId, onSelectDim }) {
  const containerRef = useRef(null);
  const { zoom, offsetX, offsetY, fitScreen, handleWheel, handleMouseDown, handleMouseMove, handleMouseUp, handleDblClick } = usePanZoom(containerRef);
  const [imageError, setImageError] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(() => {
    setImageError(false);
    fitScreen();
  }, [drawing?.id]);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    el.addEventListener("wheel", handleWheel, { passive: false });
    return () => el.removeEventListener("wheel", handleWheel);
  }, [handleWheel]);

  const showGuides = zoom < 0.5;
  const adjustedDims = useMemo(() =>
    showGuides ? applyRepulsion(dims, zoom, 28) : dims.map((d, i) => ({ ...d, _gx: 0, _gy: 0, _idx: i })),
    [dims, zoom, showGuides]
  );

  const imgSrc = drawing ? `/static/drawings/${drawing.id}/page_1.jpg?t=${reloadKey}` : null;

  return React.createElement("div", {
    ref: containerRef,
    onMouseDown: handleMouseDown, onMouseMove: handleMouseMove, onMouseUp: handleMouseUp,
    onMouseLeave: handleMouseUp, onDoubleClick: handleDblClick,
    style: canvasStyles.container,
  },
    // Toolbar
    React.createElement("div", { style: canvasStyles.toolbar },
      React.createElement("span", { style: canvasStyles.zoomLabel }, `${Math.round(zoom * 100)}%`),
      React.createElement("button", { onClick: fitScreen, style: canvasStyles.toolbarBtn, title: "适应窗口" }, "⊞"),
    ),
    // Image or fallback
    imageError
      ? React.createElement("div", { style: canvasStyles.fallback },
          React.createElement("div", { style: canvasStyles.fallbackIcon }, "📐"),
          React.createElement("div", { style: canvasStyles.fallbackText }, "图纸图片未生成"),
          React.createElement("div", { style: canvasStyles.fallbackHint }, "请重新上传版本或点击下方按钮重新生成"),
          React.createElement("button", {
            onClick: async () => {
              try {
                const resp = await fetch(`/parts/${partId}/versions/${versionId}/reprocess`, { method: "POST" });
                if (resp.ok) {
                  setReloadKey((k) => k + 1);
                  setImageError(false);
                }
              } catch (err) { /* silently fail */ }
            },
            style: canvasStyles.reprocessBtn,
          }, "重新生成图片"),
        )
      : imgSrc && React.createElement("img", {
          src: imgSrc,
          onError: () => setImageError(true),
          style: {
            ...canvasStyles.image,
            transform: `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`,
            transformOrigin: "0 0",
          },
          draggable: false,
        }),
    // SVG guide lines
    showGuides && React.createElement("svg", { style: canvasStyles.svgOverlay },
      adjustedDims.filter((d) => Math.abs(d._gx) > 1 || Math.abs(d._gy) > 1).map((d) => {
        const sx = (d.anchor_x + d._gx) * zoom + offsetX;
        const sy = (d.anchor_y + d._gy) * zoom + offsetY;
        const ex = d.anchor_x * zoom + offsetX;
        const ey = d.anchor_y * zoom + offsetY;
        return React.createElement("line", {
          key: `guide-${d.id}`,
          x1: sx, y1: sy, x2: ex, y2: ey,
          stroke: "var(--ink-disabled)", strokeWidth: 1,
          strokeDasharray: "3 3", opacity: 0.5,
        });
      })
    ),
    // Marker labels
    adjustedDims.map((d) =>
      React.createElement(MarkerLabel, {
        key: d.id,
        dim: { ...d, anchor_x: d.anchor_x + d._gx, anchor_y: d.anchor_y + d._gy },
        zoom, offsetX, offsetY,
        isSelected: d.id === selectedDimId,
        onClick: onSelectDim,
      })
    ),
  );
}

// ── DimensionList ────────────────────────────────────────────────────────
function DimensionList({ dims, selectedDimId, onSelect, filter, onFilterChange }) {

  const filterOptions = ["all", "pending", "confirmed", "questionable"];

  const filtered = filter === "all" ? dims : dims.filter((d) => d.review_status === filter);

  return React.createElement("div", { style: dimListStyles.wrapper },
    React.createElement("div", { style: dimListStyles.filterBar },
      filterOptions.map((opt) =>
        React.createElement("button", {
          key: opt,
          onClick: () => onFilterChange(opt),
          style: {
            ...dimListStyles.filterBtn,
            color: filter === opt ? "var(--accent-primary)" : "var(--ink-secondary)",
            borderBottomColor: filter === opt ? "var(--accent-primary)" : "transparent",
          },
        }, opt === "all" ? "全部" : statusLabels[opt])
      ),
      React.createElement("span", { style: dimListStyles.count }, `${filtered.length}/${dims.length}`),
    ),
    React.createElement("div", { style: dimListStyles.list },
      filtered.length === 0
        ? React.createElement("div", { style: dimListStyles.empty }, "暂无标注")
        : filtered.map((d) =>
            React.createElement("div", {
              key: d.id,
              onClick: () => onSelect(d.id),
              style: { ...dimListStyles.item, background: d.id === selectedDimId ? "rgba(240,165,0,0.08)" : "transparent" },
            },
              React.createElement("span", { style: dimListStyles.seq }, String(d.sequence).padStart(2, "0")),
              React.createElement("span", { style: dimListStyles.value }, d.value),
              React.createElement(StatusDot, { status: d.review_status }),
              d.message_count > 0 && React.createElement("span", { style: dimListStyles.badge }, d.message_count),
            )
          )
    ),
  );
}

function DimensionDetail({ dim, readOnly, onStatusChange }) {
  if (!dim) {
    return React.createElement("div", { style: { padding: "var(--space-16)", color: "var(--ink-disabled)", fontSize: 12, textAlign: "center" } }, "选择一个标注");
  }

  const statuses = [
    { value: "pending", label: "待审" },
    { value: "confirmed", label: "确认" },
    { value: "questionable", label: "存疑" },
  ];

  return React.createElement("div", { style: ddStyles.wrapper },
    React.createElement("div", { style: ddStyles.header },
      React.createElement("span", { style: ddStyles.seq }, `#${String(dim.sequence).padStart(2, "0")}`),
      React.createElement("span", { style: ddStyles.value }, dim.value),
    ),
    React.createElement("div", { style: ddStyles.grid },

      React.createElement(DDField, { label: "坐标", value: dim.anchor_x ? `${Math.round(dim.anchor_x)}, ${Math.round(dim.anchor_y)}` : "—" }),
    ),
    !readOnly && React.createElement("div", { style: ddStyles.statusRow },
      React.createElement("span", { style: { fontSize: 11, color: "var(--ink-secondary)", textTransform: "uppercase", letterSpacing: "0.05em" } }, "状态"),

              borderColor: dim.review_status === s.value ? "var(--accent-primary)" : "var(--border-color)",
            },
          }, s.label)
        )
      ),
    ),
  );
}

// ── DiscussionThread ─────────────────────────────────────────────────────
function DiscussionThread({ dimId, readOnly }) {
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);

  useEffect(() => {
    if (!dimId) { setMessages([]); return; }
    fetch(`/api/dimensions/${dimId}/messages`)
      .then((r) => r.json())
      .then(setMessages);
  }, [dimId]);

  const handleSend = async () => {
    if (!text.trim() || sending) return;
    setSending(true);
    try {
      const resp = await fetch(`/api/dimensions/${dimId}/messages`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ author: "审核员", content: text.trim() }),
      });
      if (resp.ok) {
        const msg = await resp.json();
        setMessages((prev) => [...prev, msg]);
        setText("");
      }
    } finally {
      setSending(false);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
  };

  return React.createElement("div", { style: discStyles.wrapper },
    React.createElement("div", { style: discStyles.messages },
      messages.length === 0
        ? React.createElement("div", { style: { color: "var(--ink-disabled)", fontSize: 12, textAlign: "center", padding: 16 } }, "暂无讨论")
        : messages.map((m) =>
            React.createElement("div", { key: m.id, style: discStyles.bubble },
              React.createElement("div", { style: discStyles.meta },
                React.createElement("span", { style: discStyles.author }, m.author),
                React.createElement("span", { style: discStyles.time }, m.created_at),
              ),
              React.createElement("div", { style: discStyles.content }, m.content),
            )
          )
    ),
    !readOnly && React.createElement("div", { style: discStyles.inputRow },
      React.createElement("input", {
        type: "text", placeholder: "输入讨论内容...",
        value: text, onChange: (e) => setText(e.target.value),
        onKeyDown: handleKeyDown, style: discStyles.input,
      }),
      React.createElement("button", {
        onClick: handleSend, disabled: sending || !text.trim(),
        style: { ...discStyles.sendBtn, opacity: sending || !text.trim() ? 0.5 : 1 },
      }, "发送"),
    ),
  );
}

// ── ConclusionBar ────────────────────────────────────────────────────────
function ConclusionBar({ dims, versionInfo, readOnly, onConfirm }) {
  const counts = useMemo(() => ({
    total: dims.length,
    pending: dims.filter((d) => d.review_status === "pending").length,
    confirmed: dims.filter((d) => d.review_status === "confirmed").length,
    questionable: dims.filter((d) => d.review_status === "questionable").length,
  }), [dims]);

  const [notes, setNotes] = useState(versionInfo?.notes || "");
  const [showConfirm, setShowConfirm] = useState(false);
  const [confirmAction, setConfirmAction] = useState(null);

  const handleConfirm = () => {
    onConfirm(confirmAction, notes);
    setShowConfirm(false);
  };

  if (versionInfo?.confirm_result && readOnly) {
    const date = versionInfo.confirmed_at || "";
    return React.createElement("div", { style: cbStyles.wrapper },
      React.createElement("div", { style: cbStyles.stampArea },
        React.createElement(Stamp, { type: versionInfo.confirm_result, date }),
      ),
    );
  }

  return React.createElement("div", { style: cbStyles.wrapper },
    React.createElement("div", { style: cbStyles.stats },
      React.createElement("span", { style: cbStyles.stat }, `共 ${counts.total} 条`),
      React.createElement("span", { style: { ...cbStyles.stat, color: "var(--ink-disabled)" } }, `待审 ${counts.pending}`),
      React.createElement("span", { style: { ...cbStyles.stat, color: "var(--signal-green)" } }, `确认 ${counts.confirmed}`),
      React.createElement("span", { style: { ...cbStyles.stat, color: "var(--signal-amber)" } }, `存疑 ${counts.questionable}`),
    ),
    !readOnly && React.createElement("div", null,
      React.createElement("textarea", {
        placeholder: "审核备注...", value: notes,
        onChange: (e) => setNotes(e.target.value),
        style: cbStyles.notes,
        rows: 2,
      }),
      React.createElement("div", { style: cbStyles.actions },
        React.createElement("button", {
          onClick: () => { setConfirmAction("approved"); setShowConfirm(true); },
          style: { ...cbStyles.btn, background: "var(--signal-green)", color: "#fff" },
        }, "✓ 通过"),
        React.createElement("button", {
          onClick: () => { setConfirmAction("rejected"); setShowConfirm(true); },
          style: { ...cbStyles.btn, background: "var(--signal-red)", color: "#fff" },
        }, "✕ 驳回"),
      ),
    ),
    showConfirm && React.createElement("div", { style: cbStyles.overlay, onClick: () => setShowConfirm(false) },
      React.createElement("div", { style: cbStyles.dialog, onClick: (e) => e.stopPropagation() },
        React.createElement("div", { style: { fontSize: 14, marginBottom: 12, color: "var(--ink)" } },
          `确认${confirmAction === "approved" ? "通过" : "驳回"}此版本？`
        ),
        React.createElement("div", { style: { fontSize: 12, color: "var(--ink-secondary)", marginBottom: 16 } },
          `待审标注 ${counts.pending} 条，${confirmAction === "approved" ? "通过后标注状态将被锁定" : "驳回后版本将被标记为不合格"}.`
        ),
        React.createElement("div", { style: { display: "flex", gap: 8, justifyContent: "flex-end" } },
          React.createElement("button", { onClick: () => setShowConfirm(false), style: cbStyles.cancelBtn }, "取消"),
          React.createElement("button", { onClick: handleConfirm, style: { ...cbStyles.btn, background: "var(--accent-primary)", color: "#1e2127" } }, "确认提交"),
        ),
      ),
    ),
  );
}

const cbStyles = {

  notes: {
    width: "100%", padding: "6px 10px", background: "var(--bg-canvas)",
    border: "1px solid var(--border-color)", borderRadius: "var(--radius)",
    color: "var(--ink)", fontSize: 12, outline: "none", resize: "vertical",
    boxSizing: "border-box", margin: "var(--space-8) var(--space-12)",

// ── App ──────────────────────────────────────────────────────────────────
function App() {
  const [versions, setVersions] = useState([]);
  const [currentVersionId, setCurrentVersionId] = useState(versionId);
  const [drawings, setDrawings] = useState([]);
  const [activeDrawingId, setActiveDrawingId] = useState(null);
  const [dims, setDims] = useState([]);
  const [selectedDimId, setSelectedDimId] = useState(null);
  const [versionInfo, setVersionInfo] = useState(null);
  const [dimFilter, setDimFilter] = useState("all");
  const [stampAnim, setStampAnim] = useState(false);

  // Fetch versions
  useEffect(() => {
    fetch(`/api/parts/${partId}/versions`)
      .then((r) => r.json())
      .then((data) => {
        setVersions(data);
        const cv = data.find((v) => v.id === currentVersionId);
        if (cv) setVersionInfo(cv);
      });
  }, [partId]);

  // Fetch drawings for current version
  useEffect(() => {
    fetch(`/api/versions/${currentVersionId}/drawings`)
      .then((r) => r.json())
      .then((data) => {
        setDrawings(data);
        if (data.length > 0 && !activeDrawingId) {
          setActiveDrawingId(data[0].id);
        }
      });
  }, [currentVersionId]);

  // Fetch dimensions for active drawing
  useEffect(() => {
    if (!activeDrawingId) { setDims([]); return; }
    fetch(`/api/versions/${currentVersionId}/drawings/${activeDrawingId}/dimensions`)
      .then((r) => r.json())
      .then(setDims);
  }, [currentVersionId, activeDrawingId]);

  const handleVersionChange = (vid) => {
    setCurrentVersionId(vid);
    setActiveDrawingId(null);
    setSelectedDimId(null);
    setDimFilter("all");
    window.history.replaceState(null, "", `/parts/${partId}/versions/${vid}/review`);
    const cv = versions.find((v) => v.id === vid);
    if (cv) setVersionInfo(cv);
  };

  const handleStatusChange = async (dimId, newStatus) => {
    await fetch(`/api/dimensions/${dimId}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ review_status: newStatus }),
    });
    setDims((prev) => prev.map((d) => d.id === dimId ? { ...d, review_status: newStatus } : d));
  };

  const handleConfirm = async (result, notes) => {
    await fetch(`/api/versions/${currentVersionId}/conclusion`, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ result, notes }),
    });
    setVersionInfo((prev) => prev ? { ...prev, confirm_result: result, status: "confirmed", notes } : prev);
    setStampAnim(true);
    setTimeout(() => setStampAnim(false), 600);
  };

  const activeDrawing = drawings.find((d) => d.id === activeDrawingId);
  const selectedDim = dims.find((d) => d.id === selectedDimId);
  const isReadOnly = versionInfo?.confirm_result != null && !versionInfo?.is_current;

  return React.createElement("div", { style: appStyles.wrapper },
    React.createElement(AppShell, {
      breadcrumbs: [
        { label: "零件列表", href: "/parts/" },
        { label: "审核工作台" },
      ],
    },
      React.createElement("div", { style: appStyles.topBar },
        React.createElement("span", { style: { fontSize: 13, fontWeight: 600, fontFamily: "var(--font-display)" } }, versionInfo?.version_code || ""),
        React.createElement(VersionSelector, {
          versions, currentVersionId,
          onChange: handleVersionChange,
        }),
        versionInfo && React.createElement(StatusDot, { status: versionInfo.status, label: versionInfo.status, pulse: versionInfo.status === "processing" }),
      ),
      React.createElement("div", { style: appStyles.body },
        React.createElement("div", { style: appStyles.canvasArea },
          drawings.length > 1 && React.createElement(DrawingTabs, {
            drawings, activeDrawingId, onSelect: setActiveDrawingId,
          }),
          React.createElement(DrawingCanvas, {
            drawing: activeDrawing,
            dims, selectedDimId, onSelectDim: setSelectedDimId,
          }),
        ),
        React.createElement("div", { style: appStyles.panel },
          React.createElement(DimensionList, {
            dims, selectedDimId, onSelect: setSelectedDimId,
            filter: dimFilter, onFilterChange: setDimFilter,
          }),
          React.createElement(DimensionDetail, {
            dim: selectedDim,
            readOnly: isReadOnly || !!versionInfo?.confirm_result,
            onStatusChange: handleStatusChange,
          }),
          selectedDimId && React.createElement(DiscussionThread, {
            dimId: selectedDimId,
            readOnly: isReadOnly || !!versionInfo?.confirm_result,
          }),
          React.createElement(ConclusionBar, {
            dims, versionInfo,
            readOnly: isReadOnly,
            onConfirm: handleConfirm,
          }),
        ),
      ),
    ),
  );
}

const appStyles = {
  wrapper: { height: "100%", display: "flex", flexDirection: "column" },
  topBar: {
    display: "flex", alignItems: "center", gap: "var(--space-12)",
    padding: "6px var(--space-16)", background: "var(--bg-surface)",
    borderBottom: "1px solid var(--border-color)",
  },
  body: { flex: 1, display: "flex", overflow: "hidden" },
  canvasArea: { flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" },
  panel: {
    width: 340, minWidth: 280, background: "var(--bg-surface)",
    borderLeft: "1px solid var(--border-color)", overflowY: "auto",
    display: "flex", flexDirection: "column",
  },
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
